---
- name: Instalar nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Obtener la ruta hacia Internet
  ansible.builtin.command: ip -4 route get 1.1.1.1
  register: router_route
  changed_when: false

- name: Obtener las interfaces de red
  ansible.builtin.command: ip -o link
  register: router_links
  changed_when: false

- name: Detectar la interfaz de salida
  ansible.builtin.set_fact:
    router_wan_interface: "{{ router_route.stdout.split('dev ')[1].split(' ')[0] }}"

- name: Localizar la interfaz interna
  ansible.builtin.set_fact:
    router_lan_matches: "{{ router_links.stdout_lines | select('search', '52:54:00:36:a7:ea') | list }}"

- name: Comprobar las interfaces detectadas
  ansible.builtin.assert:
    that:
      - router_lan_matches | length == 1
      - router_wan_interface != (router_lan_matches[0].split(':')[1] | trim)
    fail_msg: "No se han podido identificar correctamente las interfaces del router."

- name: Guardar el nombre de la interfaz interna
  ansible.builtin.set_fact:
    router_lan_interface: "{{ router_lan_matches[0].split(':')[1] | trim }}"

- name: Activar el reenvío IPv4 permanentemente
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-router.conf
    content: "net.ipv4.ip_forward=1\n"
    owner: root
    group: root
    mode: "0644"
  notify: Aplicar configuración sysctl

- name: Configurar las reglas de nftables
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recargar nftables

- name: Habilitar nftables
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true
