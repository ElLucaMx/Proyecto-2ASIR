---
- name: Esperar a que cloud-init termine la inicialización
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Actualizar la cache de paquetes en Debian y Ubuntu
  ansible.builtin.apt:
    update_cache: yes
    upgrade: safe
    cache_valid_time: 3600
  when: ansible_facts.pkg_mgr == 'apt'

- name: Actualizar paquetes en Alpine
  community.general.apk:
    update_cache: true
    upgrade: true
  when: ansible_facts.pkg_mgr == 'apk'

- name: Instalar paquetes comunes del sistema
  ansible.builtin.package:
    name:
      - curl
      - git
    state: present
