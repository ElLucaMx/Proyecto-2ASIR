---
- name: Esperar a que cloud-init termine la inicialización
  ansible.builtin.command: cloud-init status --wait
  register: cloud_init_status
  changed_when: false
  failed_when: cloud_init_status.rc not in [0, 2]

- name: Actualizar los índices de paquetes APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalar herramientas comunes del sistema
  ansible.builtin.apt:
    name:
      - curl
      - git
    state: present
