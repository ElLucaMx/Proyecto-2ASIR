---
- name: Instalar Apache, PHP y módulos necesarios para MariaDB
  ansible.builtin.apt:
    name:
      - apache2
      - php
      - libapache2-mod-php
      - php-mysql
      - php-mysqli
    state: present
    update_cache: yes

- name: Asegurar que Apache está iniciado y habilitado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: yes

- name: Eliminar el fichero index.html por defecto de Apache si existe
  ansible.builtin.file:
    path: /var/www/html/index.html
    state: absent

- name: Clonar el repositorio de la biblioteca desde GitHub
  ansible.builtin.git:
    repo: 'https://github.com/VidaInformatico/Sistema-de-biblioteca-basico-php-8-y-mysql.git'
    dest: /var/www/html/
    force: no
    update: no

- name: Configurar la conexión a la base de datos mediante plantilla
  ansible.builtin.template:
    src: config.php.j2
    dest: /var/www/html/Config/Config.php
    owner: www-data
    group: www-data
    mode: '0644'
  notify: Reiniciar Apache

- name: Configurar el Virtual Host de Apache para la aplicación
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/apache2/sites-available/biblioteca.conf
    mode: '0644'
  notify: Reiniciar Apache

- name: Desactivar el sitio por defecto de Apache de forma idempotente
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  notify: Reiniciar Apache

- name: Activar el nuevo sitio de la biblioteca en Apache
  ansible.builtin.command: a2ensite biblioteca.conf
  args:
    creates: /etc/apache2/sites-enabled/biblioteca.conf
  notify: Reiniciar Apache

- name: Habilitar el módulo rewrite de Apache para el enrutamiento MVC
  ansible.builtin.command: a2enmod rewrite
  notify: Reiniciar Apache
  changed_when: false
