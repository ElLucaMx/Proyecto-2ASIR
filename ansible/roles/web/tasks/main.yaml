---
- name: Instalar Apache, PHP y módulos necesarios para MariaDB
  ansible.builtin.apt:
    name:
      - apache2
      - php
      - libapache2-mod-php
      - php-mysql
      - php-mysqli
    state: present
    update_cache: yes

- name: Asegurar que Apache está iniciado y habilitado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: yes

- name: Configurar el Virtual Host de Apache para la aplicación
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/apache2/sites-available/biblioteca.conf
    mode: '0644'
  notify: Reiniciar Apache

- name: Desactivar el sitio por defecto de Apache de forma idempotente
  ansible.builtin.command: a2dissite 000-default.conf
  args:
    creates: /etc/apache2/sites-enabled/000-default.conf
  notify: Reiniciar Apache

- name: Activar el nuevo sitio de la biblioteca en Apache
  ansible.builtin.command: a2ensite biblioteca.conf
  args:
    creates: /etc/apache2/sites-enabled/biblioteca.conf
  notify: Reiniciar Apache
