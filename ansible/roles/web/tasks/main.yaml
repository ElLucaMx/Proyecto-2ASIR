---
- name: Instalar Apache y PHP con sus módulos
  ansible.builtin.apt:
    name:
      - apache2
      - php
      - libapache2-mod-php
      - php-mysql
      - git
    state: present
    update_cache: yes

- name: Asegurar que Apache está iniciado y habilitado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: yes

- name: Clonar o copiar el código de la aplicación guestbook_php
  ansible.builtin.git:
    repo: 'https://github.com/josejuansanchez/guestbook-php.git' # O la URL del repositorio que uses para la app
    dest: /var/www/html/guestbook
    force: yes

- name: Generar el fichero config.php mediante plantilla
  ansible.builtin.template:
    src: config.php.j2
    dest: /var/www/html/guestbook/config.php
    mode: '0644'

- name: Configurar el Virtual Host de Apache
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/apache2/sites-available/guestbook.conf
  notify: Reiniciar Apache

- name: Habilitar el sitio web y desactivar el por defecto
  ansible.builtin.ansible.builtin.command: # o usar a2ensite / a2dissite
  # Alternativa limpia con comandos de apache:
  args:
    creates: /etc/apache2/sites-enabled/guestbook.conf
  notify: Reiniciar Apache

- name: Activar site guestbook en Apache
  ansible.builtin.command: a2ensite guestbook.conf
  notify: Reiniciar Apache

- name: Desactivar site por defecto de Apache
  ansible.builtin.command: a2dissite 000-default.conf
  notify: Reiniciar Apache
