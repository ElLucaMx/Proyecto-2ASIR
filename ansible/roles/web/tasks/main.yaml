---
- name: Instalar Apache, PHP y extensión MySQLi
  ansible.builtin.apt:
    name:
      - apache2
      - php
      - libapache2-mod-php
      - php-mysql
    state: present
    update_cache: yes

- name: Asegurar que Apache está iniciado y habilitado
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: yes

- name: Crear el directorio de Guestbook
  ansible.builtin.file:
    path: /var/www/guestbook
    state: directory
    owner: root
    group: www-data
    mode: '0755'

- name: Clonar el repositorio de Guestbook desde GitHub
  ansible.builtin.git:
    repo: 'https://github.com/whoisYoges/simple-guestbook.git'
    dest: /var/www/guestbook
    version: master
    force: yes
    update: yes

- name: Configurar la conexión a MariaDB mediante plantilla
  ansible.builtin.template:
    src: config.php.j2
    dest: /var/www/guestbook/config.php
    owner: root
    group: www-data
    mode: '0640'
  notify: Reiniciar Apache

- name: Configurar el VirtualHost de Guestbook
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/apache2/sites-available/guestbook.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar Apache

- name: Desactivar el sitio predeterminado de Apache
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  notify: Reiniciar Apache

- name: Activar el VirtualHost de Guestbook
  ansible.builtin.command: a2ensite guestbook.conf
  args:
    creates: /etc/apache2/sites-enabled/guestbook.conf
  notify: Reiniciar Apache

- name: Comprobar la configuración de Apache
  ansible.builtin.command: apache2ctl configtest
  changed_when: false
