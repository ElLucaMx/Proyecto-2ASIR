---
- name: Instalar MariaDB, cliente y conector PyMySQL
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
      - python3-pymysql
    state: present
    update_cache: yes

- name: Eliminar el antiguo conector MySQLdb
  ansible.builtin.apt:
    name: python3-mysqldb
    state: absent

- name: Asegurar que el servicio MariaDB está iniciado y habilitado
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: yes

- name: Configurar MariaDB para que escuche en la red de datos
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: 'bind-address = {{ db_host }}'
  notify: Reiniciar MariaDB

- name: Crear la base de datos de Guestbook
  ansible.mariadb.mariadb_db:
    name: "{{ db_name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: /run/mysqld/mysqld.sock
    login_user: root

- name: Comprobar si existe la tabla de Guestbook
  ansible.mariadb.mariadb_query:
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock
    login_db: "{{ db_name }}"
    query: "SHOW TABLES LIKE '{{ guestbook_table }}';"
  register: guestbook_table_check
  changed_when: false

- name: Crear la tabla de Guestbook
  ansible.mariadb.mariadb_query:
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE `{{ guestbook_table }}` (
        `id` INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
        `name` VARCHAR(60) NOT NULL,
        `message` TEXT NOT NULL,
        `date` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
      ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
  when: guestbook_table_check.query_result[0] | length == 0

- name: Crear el usuario de Guestbook con permisos exclusivos para el servidor web
  ansible.mariadb.mariadb_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "10.0.0.1"
    priv: "{{ db_name }}.{{ guestbook_table }}:SELECT,INSERT"
    column_case_sensitive: true
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock

# --- COPIAS DE SEGURIDAD NFS ---
# --- COPIAS DE SEGURIDAD NFS ---

- name: Instalar el cliente NFS y las herramientas de copias
  ansible.builtin.apt:
    name:
      - nfs-common
      - cron
      - gzip
      - util-linux
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Asegurar que el servicio cron está iniciado y habilitado
  ansible.builtin.service:
    name: cron
    state: started
    enabled: yes

- name: Crear el punto de montaje NFS
  ansible.builtin.file:
    path: "{{ nfs_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configurar el montaje NFS permanente en fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\\S+\\s+{{ nfs_mount_path | regex_escape }}\\s+'
    line: "{{ nfs_server_ip }}:{{ nfs_export_path }} {{ nfs_mount_path }} nfs defaults,_netdev,nofail 0 0"
    state: present
    backup: yes

- name: Comprobar si el recurso NFS está montado
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ nfs_mount_path }}"
  register: nfs_mount_status
  changed_when: false
  failed_when: false

- name: Montar el recurso NFS
  ansible.builtin.command:
    argv:
      - mount
      - "{{ nfs_mount_path }}"
  when: nfs_mount_status.rc != 0

- name: Instalar el script de copias de seguridad de MariaDB
  ansible.builtin.template:
    src: backup-mariadb.sh.j2
    dest: /usr/local/sbin/backup-mariadb.sh
    owner: root
    group: root
    mode: '0750'

- name: Comprobar la sintaxis del script de copias
  ansible.builtin.command:
    argv:
      - bash
      - -n
      - /usr/local/sbin/backup-mariadb.sh
  changed_when: false

- name: Programar las copias diarias de MariaDB
  ansible.builtin.cron:
    name: "Copia de seguridad diaria de MariaDB"
    user: root
    minute: "{{ backup_cron_minute }}"
    hour: "{{ backup_cron_hour }}"
    job: "/usr/local/sbin/backup-mariadb.sh"
    state: present
