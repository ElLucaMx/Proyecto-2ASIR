---
- name: Instalar MariaDB, cliente y conector PyMySQL
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
      - python3-pymysql
    state: present
    update_cache: yes

- name: Eliminar el antiguo conector MySQLdb
  ansible.builtin.apt:
    name: python3-mysqldb
    state: absent

- name: Asegurar que el servicio MariaDB está iniciado y habilitado
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: yes

- name: Configurar MariaDB para que escuche en la red de datos
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: 'bind-address = {{ db_host }}'
  notify: Reiniciar MariaDB

- name: Crear la base de datos de Guestbook
  ansible.mariadb.mariadb_db:
    name: "{{ db_name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: /run/mysqld/mysqld.sock
    login_user: root

- name: Comprobar si existe la tabla de Guestbook
  ansible.mariadb.mariadb_query:
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock
    login_db: "{{ db_name }}"
    query: "SHOW TABLES LIKE '{{ guestbook_table }}';"
  register: guestbook_table_check
  changed_when: false

- name: Crear la tabla de Guestbook
  ansible.mariadb.mariadb_query:
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE `{{ guestbook_table }}` (
        `id` INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
        `name` VARCHAR(60) NOT NULL,
        `message` TEXT NOT NULL,
        `date` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
      ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
  when: guestbook_table_check.query_result[0] | length == 0

- name: Crear el usuario de Guestbook con permisos exclusivos para el servidor web
  ansible.mariadb.mariadb_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "10.0.0.1"
    priv: "{{ db_name }}.{{ guestbook_table }}:SELECT,INSERT"
    column_case_sensitive: true
    state: present
    login_user: root
    login_unix_socket: /run/mysqld/mysqld.sock
