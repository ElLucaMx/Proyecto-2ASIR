---
- name: Configurar infraestructura común en ServidorWeb
  hosts: servidores_web
  become: true
  roles:
    - commons

- name: Configurar ServidorWeb como router
  hosts: servidores_web
  become: true
  roles:
    - router

- name: Configurar infraestructura común en DB y Backup
  hosts: servidores_bd:servidores_backup
  become: true
  roles:
    - commons

- name: Configurar el servidor de copias de seguridad NFS
  hosts: servidores_backup
  become: true
  roles:
    - backup

- name: Configurar el servidor de Base de Datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

- name: Configurar el Servidor Web y la aplicación
  hosts: servidores_web
  become: true
  roles:
    - web
