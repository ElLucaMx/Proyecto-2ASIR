#cloud-config

hostname: ServidorAlmacenamiento
timezone: Europe/Madrid

package_update: false
package_upgrade: false

# Configuración SSH
ssh_pwauth: true
disable_root: false

# Usuario administrador
users:
  - name: user
    gecos: Usuario administrador
    shell: /bin/ash
    groups:
      - wheel
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-rsa  usuario@Deby

  - name: root
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-rsa  usuario@Deby

# Contraseñas
chpasswd:
  expire: false
  users:
    - name: user
      password: user
      type: text
    - name: root
      password: root
      type: text
