#cloud-config
hostname: ServidorAlmacenamiento

timezone: Europe/Madrid

# Evitar actualizaciones automáticas durante la inicialización (específico para Alpine / estabilidad)
package_update: false
package_upgrade: false

# Configuración SSH
ssh_pwauth: true
disable_root: false

# Crear explícitamente los usuarios
users:
  - name: user
    gecos: Usuario administrador Almacenamiento
    shell: /bin/ash
    groups:
      - wheel
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-rsa  usuario@Deby

  - name: root
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-rsa  usuario@Deby

# Establecer contraseñas
chpasswd:
  expire: false
  users:
    - name: alpine
      password: alpine
      type: text
    - name: root
      password: root
      type: text
